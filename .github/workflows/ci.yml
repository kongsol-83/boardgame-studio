name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 실수로 커밋되면 되돌릴 수 없는 것들을 막는다.
  # .gitignore 는 `git add -f` 한 번이면 뚫리지만 이 잡은 안 뚫린다.
  guard:
    name: 커밋 금지 항목 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: BGG 데이터가 추적되고 있지 않은지 확인
        run: |
          # XML API 이용약관상 BGG 데이터는 재배포할 수 없다.
          leaked=$(git ls-files | grep -E '^data/|\.sqlite3?$|\.db$|boardgames_ranks_.*\.zip$' || true)
          if [ -n "$leaked" ]; then
            echo "::error::BGG 데이터는 커밋할 수 없습니다. data/ 는 gitignore 대상입니다."
            echo "$leaked"
            exit 1
          fi
          echo "BGG 데이터 없음"

      - name: 본인 게임 프로젝트가 추적되고 있지 않은지 확인
        run: |
          # 공모전 출품작이 공개되면 출품 자격까지 걸릴 수 있다. example-* 만 허용.
          leaked=$(git ls-files 'projects/*' | grep -v '^projects/example-' || true)
          if [ -n "$leaked" ]; then
            echo "::error::projects/ 아래는 example-* 만 커밋할 수 있습니다."
            echo "$leaked"
            exit 1
          fi
          echo "example 외 프로젝트 없음"

      - name: 시크릿 파일이 추적되고 있지 않은지 확인
        run: |
          leaked=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.[^/]*$' | grep -v '\.env\.example$' || true)
          if [ -n "$leaked" ]; then
            echo "::error::.env 파일은 커밋할 수 없습니다. .env.example 만 추적합니다."
            echo "$leaked"
            exit 1
          fi
          echo "시크릿 파일 없음"

      - name: .env.example 템플릿이 남아 있는지 확인
        run: |
          # cp 대신 이름 변경으로 .env 를 만들면 템플릿이 사라진다. 그러면 다음 사람이
          # 무엇을 채워야 하는지 알 수 없게 되므로 조용히 넘어가면 안 된다.
          if [ ! -f .env.example ]; then
            echo "::error::.env.example 이 없습니다. .env 는 복사해서 만들고 템플릿은 남겨두세요."
            exit 1
          fi
          echo ".env.example 있음"

  test:
    name: 검증과 테스트 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows에서 개발하지만 경로 처리가 리눅스에서도 맞아야 한다.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # 스킬 name이 폴더명과 다르면 Cursor가 조용히 로드하지 않는다.
      # 문법 검사와 단위 테스트도 여기 포함된다.
      - name: npm test
        run: npm test

  # 예제 프로젝트로 파이프라인을 실제로 돌린다. 단위 테스트는 함수를 보지만
  # 이건 도구들이 서로 맞물려 돌아가는지를 본다. API 키가 필요 없는 것만 실행한다.
  example:
    name: 예제 프로젝트 파이프라인
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # 리눅스 러너에는 한글 폰트가 없다. pdfkit 내장 폰트로는 한글을 못 그리므로
      # 오버플로 검사와 렌더 양쪽 모두 이게 먼저 있어야 성립한다.
      - name: 한글 폰트 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          test -f /usr/share/fonts/truetype/nanum/NanumGothic.ttf

      - name: 규격 검증
        run: node tools/spec.mjs validate example-tidepool

      - name: mm에서 픽셀 산출
        run: node tools/spec.mjs resolve example-tidepool

      - name: A4 시트 계산
        run: node tools/spec.mjs sheet example-tidepool

      - name: 표준 규격 프리셋
        run: node tools/spec.mjs presets

      - name: 수치 분석
        run: node tools/balance.mjs example-tidepool --cost cost --value power

      - name: 텍스트 오버플로 검사
        run: node tools/pnp.mjs example-tidepool --check

      - name: PDF 렌더
        run: |
          node tools/pnp.mjs example-tidepool
          # 빈 파일이 나와도 종료 코드는 0일 수 있으므로 크기를 확인한다
          find projects/example-tidepool/pnp -name '*.pdf' -size +1k | grep -q .

      # 아트를 뽑으려면 OpenAI 키가 필요해서, 이미지를 얹는 분기가 여기서만 돈다.
      # 리눅스와 Windows에서 경로 해석이 갈리는 자리라 한 번은 실제로 넣어봐야 한다.
      # 예제에 그림을 커밋하지 않는 이유는 픽스처 주석에 적어뒀다.
      - name: 아트가 붙은 카드 렌더
        run: |
          for id in TP01 TP02; do
            node tests/fixtures/placeholder-png.mjs \
              "projects/example-tidepool/art/action-card/$id.png" 750 1039
          done
          node tools/pnp.mjs example-tidepool --component action-card

          # 이미지가 실제로 들어갔는지 본다. pnp 는 이미지가 깨져도 도형으로 폴백하고
          # 종료 코드 0으로 끝나므로, 성공 여부만 보면 아무것도 검증하지 못한다.
          pdf=$(ls projects/example-tidepool/pnp/example-tidepool-????-??-??.pdf | head -1)
          if ! grep -a -q '/Subtype */Image' "$pdf"; then
            echo "::error::아트가 PDF에 들어가지 않았습니다: $pdf"
            exit 1
          fi

      - name: 룰북 검사
        run: node tools/rulebook.mjs example-tidepool --check

      - name: 룰북 PDF 렌더
        run: |
          node tools/rulebook.mjs example-tidepool --toc
          find projects/example-tidepool/pnp -name '*-rulebook-*.pdf' -size +1k | grep -q .

      - name: 엔진 스모크 (랜덤 봇)
        run: node tools/sim.mjs smoke example-tidepool --games 2000

      # 키 없이 도는 추정들. 가격표나 규격 해석이 깨지면 여기서 걸린다
      - name: 비용 추정
        run: |
          node tools/sim.mjs estimate example-tidepool
          node tools/art.mjs estimate example-tidepool

      # 처음 클론한 사람이 가장 먼저 실행하는 명령이다. 여기서 죽으면 첫인상이 끝난다.
      # 키와 인덱스가 없는 러너에서는 주의만 내고 종료 코드는 0이다.
      - name: 개발 환경 점검
        run: npm run doctor
