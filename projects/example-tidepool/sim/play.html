<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>플레이 / 리플레이</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, "Malgun Gothic", sans-serif; margin: 0; padding: 24px;
         max-width: 900px; margin-inline: auto; line-height: 1.6; }
  h1 { font-size: 1.2rem; margin: 0 0 4px; }
  .hint { opacity: 0.65; font-size: 0.85rem; margin-bottom: 20px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid currentColor;
           background: transparent; color: inherit; cursor: pointer; }
  button:hover:not(:disabled) { background: color-mix(in srgb, currentColor 12%, transparent); }
  button:disabled { opacity: 0.35; cursor: default; }
  select, input { font: inherit; padding: 5px; border-radius: 6px; }
  pre { background: color-mix(in srgb, currentColor 7%, transparent); padding: 14px;
        border-radius: 8px; white-space: pre-wrap; margin: 0 0 16px; font-size: 0.9rem; }
  .moves { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .moves button { text-align: left; width: 100%; }
  .done { padding: 14px; border: 1px solid currentColor; border-radius: 8px; }
  .status { opacity: 0.7; font-size: 0.85rem; }
</style>
</head>
<body>

<h1>플레이 / 리플레이</h1>
<p class="hint">
  같은 <code>engine.mjs</code> 를 그대로 씁니다. 승률 숫자만 봐서는 결과는 알아도 원인을
  모릅니다. 한 수씩 재생해보면 왜 그렇게 됐는지가 보입니다.
</p>

<div class="row">
  <label>인원 <select id="players"><option>2</option><option selected>3</option><option>4</option></select></label>
  <label>시드 <input id="seed" type="number" value="1" min="1" style="width: 5rem" /></label>
  <button id="start">새로 시작</button>
  <span class="status" id="mode"></span>
</div>

<div class="row">
  <input id="logfile" type="file" accept=".json" />
  <button id="step" disabled>다음 수</button>
  <button id="auto" disabled>끝까지</button>
</div>

<pre id="state">엔진을 불러오는 중...</pre>
<div id="moves" class="moves"></div>

<script type="module">
import * as engine from './engine.mjs';

// tools/lib/sim.mjs 의 makeRng 와 같은 알고리즘이어야 리플레이가 맞는다
function makeRng(seed) {
  let s = seed >>> 0;
  const next = () => {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  next.int = (max) => Math.floor(next() * max);
  next.pick = (a) => a[next.int(a.length)];
  next.shuffle = (a) => {
    const c = [...a];
    for (let i = c.length - 1; i > 0; i--) { const j = next.int(i + 1); [c[i], c[j]] = [c[j], c[i]]; }
    return c;
  };
  return next;
}

const el = (id) => document.getElementById(id);
let state = null;
let replay = null;   // 리플레이 중이면 남은 수 인덱스 배열

function render() {
  if (!state) return;
  const moves = engine.isTerminal(state) ? [] : engine.legalMoves(state);
  const player = typeof engine.currentPlayer === 'function' ? engine.currentPlayer(state) : (state.current ?? 0);

  el('state').textContent = engine.isTerminal(state)
    ? `게임 종료\n점수: ${engine.scores(state).join(' / ')}`
    : engine.describe(state, player);

  el('moves').innerHTML = '';
  el('step').disabled = !replay || replay.length === 0 || engine.isTerminal(state);
  el('auto').disabled = el('step').disabled;

  if (engine.isTerminal(state) || replay) return;

  for (const [index, move] of moves.entries()) {
    const button = document.createElement('button');
    button.textContent = `${index}. ${engine.describeMove(move)}`;
    button.onclick = () => { state = engine.applyMove(state, move); render(); };
    el('moves').append(button);
  }
}

function start(playerCount, seed, moveIndexes) {
  state = engine.setup(playerCount, makeRng(seed));
  replay = moveIndexes ? [...moveIndexes] : null;
  el('mode').textContent = replay ? `리플레이 (${replay.length}수)` : '직접 플레이';
  render();
}

el('start').onclick = () => start(Number(el('players').value), Number(el('seed').value), null);

el('step').onclick = () => {
  if (!replay?.length || engine.isTerminal(state)) return;
  const moves = engine.legalMoves(state);
  const index = replay.shift();
  state = engine.applyMove(state, moves[Math.min(index, moves.length - 1)]);
  render();
};

el('auto').onclick = () => {
  while (replay?.length && !engine.isTerminal(state)) {
    const moves = engine.legalMoves(state);
    state = engine.applyMove(state, moves[Math.min(replay.shift(), moves.length - 1)]);
  }
  render();
};

el('logfile').onchange = async (event) => {
  const file = event.target.files?.[0];
  if (!file) return;
  const data = JSON.parse(await file.text());
  const sample = data.samples?.[0];
  if (!sample) { el('state').textContent = '이 로그에는 리플레이용 샘플이 없습니다.'; return; }
  el('players').value = String(sample.playerCount);
  el('seed').value = String(sample.seed);
  start(sample.playerCount, sample.seed, sample.moves);
};

start(3, 1, null);
</script>
</body>
</html>
